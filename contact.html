<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צור קשר - עמית פרידמן</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body class="contact-page">
    <div id="navigation-root"></div>

    <main class="main-content-scroll">
        <div class="contact-wrapper">
            <div class="contact-header">
                <h2>צור קשר</h2>
                <p>נשמח לשמוע מכם</p>
            </div>

            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">שם</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-group">
                    <label for="email">דוא"ל *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">טלפון</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="message">הודעה</label>
                    <textarea id="message" name="message"></textarea>
                </div>

                <button type="submit" class="submit-btn">שלח</button>
            </form>
        </div>
    </main>

    <script src="navigation.js"></script>
    <script>
        const contactEmail = "iris.porat@gmail.com";

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;

            // Construct mailto link
            const subject = encodeURIComponent("פנייה מאתר עמית פרידמן - " + name);
            const body = encodeURIComponent(
                "שם: " + name + "\n" +
                "אימייל: " + email + "\n" +
                "טלפון: " + phone + "\n\n" +
                "הודעה:\n" + message
            );

            window.location.href = `mailto:${contactEmail}?subject=${subject}&body=${body}`;
        });

        window.onload = () => {
            initNavigation("צור קשר");
            if (window.lucide) {
                lucide.createIcons();
            }
        };
    </script>
</body>

</html>
