<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>זוכרים אותך - עמית פרידמן</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css?v=1.1">
    <link rel="stylesheet" href="remember.css">
</head>

<body class="remember-page">
    <div id="navigation-root"></div>

    <main class="main-content-scroll">
        <div class="remember-page-wrapper">

            <!-- 3x2 Cards Grid -->
            <div class="remember-grid">

                <!-- עמית מסביב לעולם -->
                <a href="#" class="remember-card" data-category="stickers">
                    <img src="images/Remember/Stickers/Rmember Amit 31.jpeg" alt="עמית מסביב לעולם" class="remember-card-img">
                    <div class="remember-card-label">
                        <span>עמית מסביב לעולם</span>
                    </div>
                </a>

                <!-- פינות הנצחה -->
                <a href="#" class="remember-card" data-category="memorial">
                    <img src="images/Remember/memorial/Rmember Amit 9.jpeg" alt="פינות הנצחה" class="remember-card-img">
                    <div class="remember-card-label">
                        <span>פינות הנצחה</span>
                    </div>
                </a>

                <!-- הופעות -->
                <a href="#" class="remember-card" data-category="shows">
                    <img src="images/Remember/shows/Rmember Amit 59.jpeg" alt="הופעות" class="remember-card-img">
                    <div class="remember-card-label">
                        <span>הופעות</span>
                    </div>
                </a>

                <!-- מסעות -->
                <a href="#" class="remember-card" data-category="journey">
                    <img src="images/Remember/journey/Rmember Amit 14.jpeg" alt="מסעות" class="remember-card-img">
                    <div class="remember-card-label">
                        <span>מסעות</span>
                    </div>
                </a>

            </div>
        </div>
    </main>

    <!-- Gallery Modal -->
    <div id="gallery-modal" class="gallery-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">
                <i data-lucide="x"></i>
            </button>
            
            <button class="nav-btn prev-btn" id="prev-btn">
                <i data-lucide="chevron-right"></i>
            </button>
            
            <div class="image-container">
                <img id="gallery-img" src="" alt="Gallery Image">
            </div>
            
            <button class="nav-btn next-btn" id="next-btn">
                <i data-lucide="chevron-left"></i>
            </button>
        </div>
        
        <div class="gallery-counter" dir="ltr">
            <span id="current-index">1</span> / <span id="total-count">1</span>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script>
        const galleryData = {
            'stickers': [
                'images/Remember/Stickers/Rmember Amit 13.jpeg',
                'images/Remember/Stickers/Rmember Amit 18.jpeg',
                'images/Remember/Stickers/Rmember Amit 19.jpeg',
                'images/Remember/Stickers/Rmember Amit 21.jpeg',
                'images/Remember/Stickers/Rmember Amit 3.jpeg',
                'images/Remember/Stickers/Rmember Amit 31.jpeg',
                'images/Remember/Stickers/Rmember Amit 32.jpeg',
                'images/Remember/Stickers/Rmember Amit 4.jpeg',
                'images/Remember/Stickers/Rmember Amit 49.jpeg',
                'images/Remember/Stickers/Rmember Amit 5.jpeg'
            ],
            'memorial': [
                'images/Remember/memorial/Rmember Amit 10.jpeg',
                'images/Remember/memorial/Rmember Amit 11.jpeg',
                'images/Remember/memorial/Rmember Amit 12.jpeg',
                'images/Remember/memorial/Rmember Amit 20.jpeg',
                'images/Remember/memorial/Rmember Amit 22.jpeg',
                'images/Remember/memorial/Rmember Amit 46.jpeg',
                'images/Remember/memorial/Rmember Amit 48.jpeg',
                'images/Remember/memorial/Rmember Amit 53.jpeg',
                'images/Remember/memorial/Rmember Amit 65.jpeg',
                'images/Remember/memorial/Rmember Amit 8.jpeg',
                'images/Remember/memorial/Rmember Amit 9.jpeg',
                'images/Remember/memorial/WhatsApp Image 2026-04-13 at 19.38.34 (1).jpeg',
                'images/Remember/memorial/הנצחה עט.jpeg',
                'images/Remember/memorial/ציור פרידמן.jpeg'
            ],
            'shows': [
                'images/Remember/shows/Rmember Amit 57.jpeg',
                'images/Remember/shows/Rmember Amit 59.jpeg',
                'images/Remember/shows/Rmember Amit 63.jpeg'
            ],
            'journey': [
                'images/Remember/journey/Rmember Amit 14.jpeg',
                'images/Remember/journey/Rmember Amit 2.jpeg',
                'images/Remember/journey/Rmember Amit 24.jpeg',
                'images/Remember/journey/Rmember Amit 27.jpeg',
                'images/Remember/journey/Rmember Amit 28.jpeg',
                'images/Remember/journey/Rmember Amit 47.jpeg',
                'images/Remember/journey/Rmember Amit 64.jpeg',
                'images/Remember/journey/Rmember Amit 7.jpeg'
            ]
        };

        let currentCategory = '';
        let currentIndex = 0;

        const modal = document.getElementById('gallery-modal');
        const galleryImg = document.getElementById('gallery-img');
        const closeModal = document.getElementById('close-modal');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currentIndexSpan = document.getElementById('current-index');
        const totalCountSpan = document.getElementById('total-count');

        function openGallery(category) {
            currentCategory = category;
            currentIndex = 0;
            updateGallery();
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateGallery() {
            const images = galleryData[currentCategory];
            if (!images || images.length === 0) return;

            galleryImg.src = images[currentIndex];
            currentIndexSpan.textContent = currentIndex + 1;
            totalCountSpan.textContent = images.length;

            if (images.length <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
            }
        }

        function nextImage() {
            const images = galleryData[currentCategory];
            currentIndex = (currentIndex + 1) % images.length;
            updateGallery();
        }

        function prevImage() {
            const images = galleryData[currentCategory];
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateGallery();
        }

        function closeGallery() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.remember-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.preventDefault();
                const category = card.getAttribute('data-category');
                openGallery(category);
            });
        });

        closeModal.addEventListener('click', closeGallery);
        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            nextImage();
        });
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            prevImage();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeGallery();
            if (modal.classList.contains('active')) {
                if (e.key === 'ArrowRight') prevImage();
                if (e.key === 'ArrowLeft') nextImage();
            }
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeGallery();
        });

        window.onload = () => {
            initNavigation("זוכרים אותך");
            if (window.lucide) {
                lucide.createIcons();
            }
        };
    </script>
</body>

</html>
